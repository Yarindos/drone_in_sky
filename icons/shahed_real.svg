<svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Реалістичний силует Shahed-136 (вигляд зверху) -->
  <g filter="url(#shadow)">
    <path d="M50 5 L95 85 L90 90 L80 85 L50 78 L20 85 L10 90 L5 85 Z" fill="#2c3e50" stroke="#ecf0f1" stroke-width="1.5"/>
    <!-- Крила та деталі -->
    <path d="M50 78 V15 M20 85 L50 40 L80 85" stroke="#34495e" stroke-width="1" fill="none"/>
    <!-- Вертикальні стабілізатори -->
    <rect x="5" y="70" width="3" height="20" fill="#1a252f" />
    <rect x="92" y="70" width="3" height="20" fill="#1a252f" />
  </g>
</svg>
